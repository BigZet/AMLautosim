services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aml_ci
      POSTGRES_PASSWORD: ${AML_CI_DB_PASSWORD:?}
      POSTGRES_DB: aml_ci
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U aml_ci
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
    - /var/lib/postgresql/data
  api:
    image: ${AML_CI_IMAGE:?}
    depends_on:
      release:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: aml_ci
      POSTGRES_PASSWORD: ${AML_CI_DB_PASSWORD:?}
      POSTGRES_DB: aml_ci
      AML_PROBABILITY_MODEL_PATH: /app/resources/catboost_models/aml-game-organizer-settings-v1
    ports:
    - 127.0.0.1::8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')
      interval: 2s
      timeout: 5s
      retries: 60
  ui:
    image: ${AML_CI_IMAGE:?}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      UI_HOST: 0.0.0.0
      UI_PORT: 8080
      COOKIE_SECURE: 'false'
      NICEGUI_STORAGE_SECRET: ${AML_CI_STORAGE_SECRET:?}
      NICEGUI_STORAGE_PATH: /home/app/nicegui
    command: python -m src.aml_workshop_simulator.ui.nicegui.app
    ports:
    - 127.0.0.1::8080
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live')
      interval: 2s
      timeout: 5s
      retries: 60
  release:
    image: ${AML_CI_IMAGE:?}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: aml_ci
      POSTGRES_PASSWORD: ${AML_CI_DB_PASSWORD:?}
      POSTGRES_DB: aml_ci
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ${AML_CI_ADMIN_PASSWORD:?}
      AML_PROBABILITY_MODEL_PATH: /app/resources/catboost_models/aml-game-organizer-settings-v1
    depends_on:
      db:
        condition: service_healthy
    command: python -m scripts.seed_database --wait-for-db --migrate --no-demo-round
    restart: 'no'
  ingress:
    image: nginx:stable-alpine@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    depends_on:
      ui:
        condition: service_healthy
    ports:
    - 127.0.0.1::80
    volumes:
    - ./nicegui.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1/health/live
      interval: 10s
      timeout: 5s
      retries: 10
