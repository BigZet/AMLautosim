# Disposable, loopback-only image verification. Credentials are generated by ci_smoke.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aml_ci
      POSTGRES_PASSWORD: ${AML_CI_DB_PASSWORD:?}
      POSTGRES_DB: aml_ci
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aml_ci']
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs: ['/var/lib/postgresql/data']
  api:
    image: ${AML_CI_IMAGE:?}
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: aml_ci
      POSTGRES_PASSWORD: ${AML_CI_DB_PASSWORD:?}
      POSTGRES_DB: aml_ci
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ${AML_CI_ADMIN_PASSWORD:?}
      AML_PROBABILITY_MODEL_PATH: /app/resources/catboost_models/aml-game-organizer-settings-v1
    command: >-
      sh -c "python -m scripts.seed_database --wait-for-db --migrate
      && exec uvicorn src.aml_workshop_simulator.api.main:app --host 0.0.0.0 --port 8000"
    ports: ['127.0.0.1::8000']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 2s
      timeout: 5s
      retries: 60
  ui:
    image: ${AML_CI_IMAGE:?}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      UI_HOST: 0.0.0.0
      UI_PORT: 8080
      COOKIE_SECURE: 'false'
      NICEGUI_STORAGE_SECRET: ${AML_CI_STORAGE_SECRET:?}
      NICEGUI_STORAGE_PATH: /home/app/nicegui
    command: python -m src.aml_workshop_simulator.ui.nicegui.app
    ports: ['127.0.0.1::8080']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live')"]
      interval: 2s
      timeout: 5s
      retries: 60
