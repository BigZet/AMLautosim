# AML production ingress. TLS terminates at the verified Timeweb balancer.
# Re-verify its source IP before changing infrastructure; do not trust all proxies.
geo $realip_remote_addr $aml_ingress_allowed {
    default 0;
    80.90.184.166/32 1;
    127.0.0.1/32 1;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    set_real_ip_from 80.90.184.166/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($aml_ingress_allowed = 0) { return 403; }

    # No URI, query strings, credentials or participant IPs in ingress logs.
    access_log off;

    location ^~ /api/ { return 404; }
    location ^~ /internal/ { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location / {
        proxy_pass http://ui:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-AML-Client-IP "";
        proxy_set_header X-AML-Client-Signature "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
