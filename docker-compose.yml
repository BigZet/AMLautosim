services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aml_simulator
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: aml
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml -d aml_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

