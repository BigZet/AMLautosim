services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aml_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-aml} -d ${POSTGRES_DB:-aml_simulator}
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      release:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aml_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-240}
      EXPANDED_ROUNDS_ENABLED: ${EXPANDED_ROUNDS_ENABLED:-true}
      API_WORKERS: ${API_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_POOL_OVERFLOW: ${DB_POOL_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      PASSWORD_ARGON2_ENABLED: ${PASSWORD_ARGON2_ENABLED:-true}
      AML_PROBABILITY_MODEL_PATH: /app/resources/catboost_models/aml-game-organizer-settings-v1
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-10}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-5}
    ports:
    - 127.0.0.1:${API_PORT:-8000}:8000
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200
        else 1)"
      interval: 10s
      timeout: 5s
      retries: 20
    image: ${AML_IMAGE:-aml-local:development}
  scoring-worker:
    image: ${AML_IMAGE:-aml-local:development}
    restart: unless-stopped
    depends_on:
      release:
        condition: service_completed_successfully
    command: python -m scripts.ops.scoring_worker
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aml_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_POOL_SIZE: 2
      DB_POOL_OVERFLOW: 0
      SCORING_THREADS: ${SCORING_THREADS:-2}
      SCORING_LEASE_SECONDS: ${SCORING_LEASE_SECONDS:-30}
      AML_PROBABILITY_MODEL_PATH: /app/resources/catboost_models/aml-game-organizer-settings-v1
  ui:
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      UI_HOST: 0.0.0.0
      UI_PORT: 8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NICEGUI_STORAGE_SECRET: ${NICEGUI_STORAGE_SECRET:?set NICEGUI_STORAGE_SECRET in .env}
      NICEGUI_STORAGE_PATH: /home/app/nicegui
    volumes:
    - nicegui_data:/home/app/nicegui
    command: python -m src.aml_workshop_simulator.ui.nicegui.app
    ports:
    - 127.0.0.1:${UI_PORT:-8080}:8080
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live')"
      interval: 10s
      timeout: 5s
      retries: 10
    image: ${AML_IMAGE:-aml-local:development}
  release:
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aml_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-240}
      EXPANDED_ROUNDS_ENABLED: ${EXPANDED_ROUNDS_ENABLED:-true}
      AML_PROBABILITY_MODEL_PATH: /app/resources/catboost_models/aml-game-organizer-settings-v1
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-10}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-5}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      PASSWORD_ARGON2_ENABLED: ${PASSWORD_ARGON2_ENABLED:-true}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env, 10-128 characters}
    depends_on:
      db:
        condition: service_healthy
    command: python -m scripts.seed_database --wait-for-db --migrate --no-demo-round
    restart: 'no'
    image: ${AML_IMAGE:-aml-local:development}
volumes:
  postgres_data: null
  nicegui_data: null
