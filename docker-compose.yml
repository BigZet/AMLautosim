# Copy .env.example to .env and fill in the required secrets before the first
# `docker compose up`. Variables written as ${VAR:?...} have no default on
# purpose: the stack must refuse to start rather than ship a known password.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aml_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only: PostgreSQL is reached over the compose network by the
      # api service. The published port exists for local psql and the test
      # suite, and must not be visible off the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aml} -d ${POSTGRES_DB:-aml_simulator}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aml_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-240}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-10}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-5}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env, 10-128 characters}
    volumes:
      - ./config:/app/config:ro
    command: >-
      sh -c "python -m scripts.seed_database --wait-for-db --migrate
      && exec uvicorn src.aml_workshop_simulator.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      # Loopback only: the participant and admin UIs reach the API over the
      # compose network. Browsers connect only to NiceGUI.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      UI_HOST: 0.0.0.0
      UI_PORT: 8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NICEGUI_STORAGE_SECRET: ${NICEGUI_STORAGE_SECRET:?set NICEGUI_STORAGE_SECRET in .env}
      NICEGUI_STORAGE_PATH: /home/app/nicegui
    volumes:
      - nicegui_data:/home/app/nicegui
    command: python -m src.aml_workshop_simulator.ui.nicegui.app
    ports:
      - "${UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  postgres_data:
  nicegui_data:
