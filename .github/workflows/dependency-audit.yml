name: Dependency audit

on:
  pull_request:
    paths: ['requirements*.txt', 'requirements*.in', '.github/workflows/dependency-audit.yml']
  push:
    branches: [master]
    paths: ['requirements*.txt', 'requirements*.in']
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lockfile: [requirements.txt, requirements-ml.txt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      # Audit tooling has its own lock and does not mutate runtime dependencies.
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m pip_audit -r ${{ matrix.lockfile }} --no-deps --disable-pip --format json --output audit.json
      # Network/tool errors fail the job too; absent evidence is never a clean audit.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-${{ matrix.lockfile }}
          path: audit.json
          if-no-files-found: error
